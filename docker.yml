# docker.yml for automated scraper
name: Docker
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Australia/Sydney'
    # branches:
    #   - main
  workflow_dispatch:

concurrency:
  group: spooderman-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HASURAGRES_API_KEY=${{ secrets.HASURAGRES_API_KEY }}
      HASURAGRES_URL=${{ secrets.HASURAGRES_URL }}
#   permissions:
#     contents: read
#     packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rust toolchain (CI/CD and package manager)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust data caching
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Run scraper
        run: cargo run --release -- scrape

      - name: Validate scraped data
        run: |
          f=path/to/output.json
          test -s "$f" || { echo: "No data scraped"; exit 1; }
      
      - name: Upload and persist scraped json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-${{github.run_id}}
          path: path/to/output.json

      - name: Batch insert
        run: cargo run --release -- batch_insert


